server:
  port: 8081

spring:
  application:
    name: iot-admin
  datasource:
    url: ${DB_URL:jdbc:sqlite:./iot-admin.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      separator: ^^
  data:
    redis:
      host: ${REDIS_HOST:192.168.12.69}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:5s}
      timeout: ${REDIS_TIMEOUT:5s}

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

auth:
  access-token-ttl: 15m
  refresh-token-ttl: 7d
